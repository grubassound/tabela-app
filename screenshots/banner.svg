<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Tabela — a shared spreadsheet with logins and roles">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#312E81"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow1)"/>
    <rect width="1280" height="320" fill="url(#glow2)"/>
    <g stroke="#FFFFFF" stroke-opacity="0.05">
      <path d="M0 64H1280M0 128H1280M0 192H1280M0 256H1280"/>
      <path d="M128 0V320M256 0V320M384 0V320M512 0V320M640 0V320M768 0V320M896 0V320M1024 0V320M1152 0V320"/>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="138" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Tabela</text>
    <text x="74" y="186" font-size="24" fill="#E0E7FF">A shared spreadsheet with logins &amp; roles</text>
    <text x="74" y="220" font-size="18" fill="#A5B4FC">Plain PHP + MySQL · no build step · drop it on Apache and go</text>

    <g font-size="14" font-weight="600">
      <rect x="74" y="244" width="92" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="120" y="264" text-anchor="middle" fill="#FFFFFF">3 roles</text>
      <rect x="176" y="244" width="104" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="228" y="264" text-anchor="middle" fill="#FFFFFF">3 themes</text>
      <rect x="290" y="244" width="128" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="354" y="264" text-anchor="middle" fill="#FFFFFF">light + dark</text>
      <rect x="428" y="244" width="136" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.12"/>
      <text x="496" y="264" text-anchor="middle" fill="#FFFFFF">EN · PL · NL</text>
    </g>

    <!-- Mini table illustration -->
    <g transform="translate(760 52)">
      <rect width="448" height="216" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.22"/>
      <g font-size="13" fill="#C7D2FE" font-weight="600">
        <text x="44" y="34">Item</text>
        <text x="214" y="34">Status</text>
        <text x="330" y="34">Qty</text>
      </g>
      <path d="M0 50H448" stroke="#FFFFFF" stroke-opacity="0.18"/>

      <g font-size="14" fill="#FFFFFF">
        <g fill="#FFFFFF" fill-opacity="0.45">
          <circle cx="20" cy="70" r="1.6"/><circle cx="26" cy="70" r="1.6"/><circle cx="20" cy="76" r="1.6"/><circle cx="26" cy="76" r="1.6"/><circle cx="20" cy="82" r="1.6"/><circle cx="26" cy="82" r="1.6"/>
        </g>
        <text x="44" y="81">Cordless drill</text>
        <rect x="210" y="63" width="82" height="24" rx="12" fill="#34D399" fill-opacity="0.22"/>
        <text x="251" y="80" text-anchor="middle" font-size="12" fill="#6EE7B7">Available</text>
        <text x="330" y="81">4</text>
        <path d="M0 100H448" stroke="#FFFFFF" stroke-opacity="0.1"/>

        <rect x="6" y="104" width="436" height="44" rx="10" fill="#FFFFFF" fill-opacity="0.12" stroke="#A5B4FC" stroke-opacity="0.8"/>
        <g fill="#FFFFFF" fill-opacity="0.9">
          <circle cx="20" cy="120" r="1.6"/><circle cx="26" cy="120" r="1.6"/><circle cx="20" cy="126" r="1.6"/><circle cx="26" cy="126" r="1.6"/><circle cx="20" cy="132" r="1.6"/><circle cx="26" cy="132" r="1.6"/>
        </g>
        <text x="44" y="131">Angle grinder</text>
        <rect x="210" y="113" width="82" height="24" rx="12" fill="#FBBF24" fill-opacity="0.22"/>
        <text x="251" y="130" text-anchor="middle" font-size="12" fill="#FCD34D">In use</text>
        <text x="330" y="131">2</text>
        <path d="M402 118l8 -8l8 8M402 134l8 8l8 -8" stroke="#C7D2FE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <path d="M0 152H448" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <g fill="#FFFFFF" fill-opacity="0.45">
          <circle cx="20" cy="170" r="1.6"/><circle cx="26" cy="170" r="1.6"/><circle cx="20" cy="176" r="1.6"/><circle cx="26" cy="176" r="1.6"/><circle cx="20" cy="182" r="1.6"/><circle cx="26" cy="182" r="1.6"/>
        </g>
        <text x="44" y="181">Laser level</text>
        <rect x="210" y="163" width="82" height="24" rx="12" fill="#F87171" fill-opacity="0.22"/>
        <text x="251" y="180" text-anchor="middle" font-size="12" fill="#FCA5A5">In repair</text>
        <text x="330" y="181">1</text>
      </g>
    </g>
  </g>
</svg>
