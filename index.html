<!DOCTYPE html>
<html lang="en" data-i18n-doctitle="docTitleIndex">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    var l = localStorage.getItem('lang');
    if (l && ['en', 'pl', 'nl'].indexOf(l) !== -1) document.documentElement.setAttribute('lang', l);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<div class="topbar">
  <div class="topbar__brand" data-i18n="brand">Table</div>
  <div class="topbar__user">
    <span class="role-pill" id="rolePill">—</span>
    <span id="usernameLabel"></span>
    <a class="btn btn--ghost" id="adminLink" href="admin.html" style="display:none;" data-i18n="settingsLink">Settings</a>
    <button class="btn btn--ghost" id="userBtn" data-i18n="userBtn">User</button>
    <button class="btn btn--ghost" id="logoutBtn" data-i18n="logoutBtn">Log out</button>
    <a class="btn btn--ghost" id="loginLink" href="login.html" style="display:none;" data-i18n="loginLink">Log in</a>
    <button class="btn btn--icon" id="themeToggle" type="button" data-i18n-title="themeToggleTitle" title="Toggle theme"></button>
  </div>
</div>

<div id="userModal" class="modal-overlay" style="display:none;">
  <div class="login-card" style="max-width:340px;">
    <h1 style="font-size:19px;" data-i18n="userModalTitle">User settings</h1>

    <div class="field">
      <label for="userLangSelect" data-i18n="languageLabel">Language</label>
      <select id="userLangSelect">
        <option value="en">English</option>
        <option value="pl">Polski</option>
        <option value="nl">Nederlands</option>
      </select>
    </div>

    <hr style="border:none; border-top:1px solid var(--border-soft); margin:20px 0;">

    <div class="error-msg" id="pwdError"></div>
    <form id="pwdForm">
      <div class="field">
        <label for="currentPassword" data-i18n="currentPasswordLabel">Current password</label>
        <input type="password" id="currentPassword" required>
      </div>
      <div class="field">
        <label for="newPassword" data-i18n="newPasswordLabel">New password (min. 6 characters)</label>
        <input type="password" id="newPassword" required minlength="6">
      </div>
      <div style="display:flex; gap:10px;">
        <button type="submit" class="btn btn--primary" style="flex:1;" data-i18n="saveBtn">Save</button>
        <button type="button" class="btn" id="pwdCancel" data-i18n="cancelBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<main>
  <div class="page-header">
    <h1 data-i18n="pageTitleSheet">Data sheet</h1>
    <div class="toolbar">
      <button class="btn btn--primary" id="addRowBtn" style="display:none;" data-i18n="addRowBtn">+ Add row</button>
      <button class="btn" id="addDividerBtn" style="display:none;" data-i18n="addDividerBtn">+ Add separator</button>
    </div>
  </div>

  <div class="table-wrap">
    <table class="sheet" id="sheetTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
    <div class="empty-state" id="emptyState" style="display:none;" data-i18n="emptyStateRows">No rows yet. Add your first entry.</div>
  </div>
</main>

<script src="js/i18n.js?v=4"></script>
<script src="js/theme.js?v=2"></script>
<script src="js/app.js?v=7"></script>
</body>
</html>
